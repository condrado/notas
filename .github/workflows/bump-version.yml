name: Incrementar version

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Incrementar version
        run: |
          commit_message=$(git log -1 --format=%B "$GITHUB_SHA")
          if printf '%s\n' "$commit_message" | grep -q '^chore: incrementar version'; then
            echo "El commit ya fue generado por la automatizacion"
            exit 0
          fi
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fqx 'package.json'; then
            echo "La version ya forma parte del commit enviado"
            exit 0
          fi
          node scripts/bump-version.mjs "$commit_message"

      - name: Publicar nueva version
        run: |
          if git diff --quiet; then
            echo "No hay cambios de version que publicar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md index.html
          git commit -m "chore: incrementar version [skip ci]"
          git push